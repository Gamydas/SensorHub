<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SensorHub</title>
<style>
  body { font-family: sans-serif; margin: 2em; }
  button { font-size: 1.2em; padding: 0.6em 1.2em; margin: 0.3em; }
</style>
</head>
<body>
<h1>SensorHub</h1>
<p>Toggle board LEDs</p>
<!-- GET /led.cgi?led=N; the CGI handler toggles LD<N> and answers with this page again -->
<form action="/led.cgi" method="get">
  <button type="submit" name="led" value="0">LED0</button>
  <button type="submit" name="led" value="1">LED1</button>
  <button type="submit" name="led" value="2">LED2</button>
  <button type="submit" name="led" value="3">LED3</button>
</form>
</body>
</html>
